---

- name: Start | Quadlet is started
  become_user: "{{ manage_container__start_items.value.quadlet.user }}"
  become: true
  ansible.builtin.systemd_service:
    name: "{{ manage_container__start_items.value.quadlet.service_name }}"
    state: started
    scope: user
  loop: "{{ manage_container__quadlet_config | dict2items }}"
  loop_control:
    loop_var: manage_container__start_items

- name: Start | Wait for Container to come up
  ansible.builtin.wait_for:
    port: "{{ manage_container__ports_items.value }}"
    delay: 5
    sleep: 1
    state: started
  loop: "{{ manage_container__ports }}"
  loop_control:
    loop_var: manage_container__ports_items
